name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ] # 如果您的預設分支是 master，請改成 master

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 這一步會自動把您在 GitHub Secrets 的資料，動態生成一個小設定檔注入網頁中
      - name: Inject Secrets via JS Config
        run: |
          echo "window.env = {" > env-config.js
          echo "  ADMIN_PASSWORD: '${{ secrets.ADMIN_PASSWORD }}'," >> env-config.js
          echo "  BOSS_PHONE: '${{ secrets.BOSS_PHONE }}'," >> env-config.js
          echo "  BOSS_LINE: '${{ secrets.BOSS_LINE }}'," >> env-config.js
          echo "  WIFE_PHONE: '${{ secrets.WIFE_PHONE }}'," >> env-config.js
          echo "  WIFE_LINE: '${{ secrets.WIFE_LINE }}'," >> env-config.js
          echo "  BANK_NAME: '${{ secrets.BANK_NAME }}'," >> env-config.js
          echo "  BANK_BRANCH: '${{ secrets.BANK_BRANCH }}'," >> env-config.js
          echo "  BANK_ACCOUNT_NAME: '${{ secrets.BANK_ACCOUNT_NAME }}'," >> env-config.js
          echo "  BANK_ACCOUNT_NO: '${{ secrets.BANK_ACCOUNT_NO }}'" >> env-config.js
          echo "};" >> env-config.js

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
