<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>龍園 - 告別式典雅蘭花線上訂購與追蹤</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col antialiased">

  <!-- Navigation Bar -->
  <header class="bg-slate-900/90 backdrop-blur-md border-b border-amber-900/30 sticky top-0 z-40 transition-all">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <div class="flex items-center space-x-3 cursor-pointer" onclick="switchTab('shop')">
        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-amber-600 to-amber-900 flex items-center justify-center text-amber-100 shadow-md border border-amber-500/30">
          <i class="fa-solid fa-seedling text-lg"></i>
        </div>
        <div>
          <span class="font-serif text-2xl font-bold tracking-wider text-gradient-gold block leading-none">龍園</span>
          <span class="text-[10px] tracking-widest text-slate-400 block mt-1 uppercase">Funeral Orchid Order System</span>
        </div>
      </div>

      <!-- Nav Tabs -->
      <nav class="flex items-center space-x-2 sm:space-x-4">
        <button id="nav-shop" onclick="switchTab('shop')" class="nav-btn active px-3 py-2 sm:px-4 sm:py-2 rounded-lg text-sm font-medium transition flex items-center gap-2">
          <i class="fa-solid fa-store"></i> <span>蘭花訂購</span>
        </button>
        <button id="nav-track" onclick="switchTab('track')" class="nav-btn px-3 py-2 sm:px-4 sm:py-2 rounded-lg text-sm font-medium transition flex items-center gap-2 relative">
          <i class="fa-solid fa-magnifying-glass"></i> <span>訂單查詢</span>
        </button>
        <button onclick="openInfoModal()" class="nav-btn px-3 py-2 sm:px-4 sm:py-2 rounded-lg text-sm font-medium transition flex items-center gap-2 text-slate-300 hover:text-amber-300">
          <i class="fa-solid fa-circle-info"></i> <span>商家資訊</span>
        </button>
      </nav>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">

    <!-- VIEW 1: SHOPPING & ORDER FORM -->
    <section id="view-shop" class="space-y-12">
      <!-- Banner -->
      <div class="relative rounded-2xl overflow-hidden border border-slate-800 bg-gradient-to-r from-slate-950 via-slate-900 to-slate-950 p-8 sm:p-12 text-center shadow-2xl">
        <div class="absolute inset-0 opacity-10 bg-[radial-gradient(#d97706_1px,transparent_1px)] [background-size:16px_16px]"></div>
        <div class
