<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>龍園 - 商家後台管理系統</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col antialiased">

  <!-- Admin Header -->
  <header class="bg-slate-950 border-b border-amber-900/30 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-amber-600 to-amber-900 flex items-center justify-center text-amber-100 shadow-md border border-amber-500/30">
          <i class="fa-solid fa-user-shield text-lg"></i>
        </div>
        <div>
          <span class="font-serif text-2xl font-bold tracking-wider text-gradient-gold block leading-none">龍園 商家後台</span>
          <span class="text-[10px] tracking-widest text-slate-400 block mt-1 uppercase">Merchant Management Portal</span>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <a href="shop.html" target="_blank" class="text-xs bg-slate-800 hover:bg-slate-700 border border-slate-600 px-3 py-1.5 rounded-lg text-slate-300 transition">
          <i class="fa-solid fa-external-link mr-1"></i> 開啟買家前台
        </a>
        <button onclick="adminLogout()" class="bg-rose-950/80 hover:bg-rose-900 border border-rose-700/60 text-rose-200 px-3 py-1.5 rounded-lg text-xs font-medium transition">
          <i class="fa-solid fa-right-from-bracket mr-1"></i> 登出後台
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      <!-- Left: Cases Management -->
      <div class="lg:col-span-1 space-y-6">
        <div class="bg-slate-800/80 rounded-xl border border-slate-700 p-5 shadow-md">
          <h2 class="font-serif text-lg font-bold text-slate-200 border-b border-slate-700 pb-3 mb-4 flex items-center gap-2">
            <i class="fa-solid fa-calendar-plus text-amber-500"></i> 新增承接案件
          </h2>
          <form onsubmit="handleAddCase(event)" class="space-y-4">
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">出殯日期</label>
              <input type="date" id="admin-case-date" required class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-slate-100 text-sm focus:outline-none focus:border-amber-500">
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">亡者姓名</label>
              <input type="text" id="admin-case-deceased" required placeholder="例如：故 張公三 先生" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-slate-100 text-sm focus:outline-none focus:border-amber-500">
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">預先上傳訃聞圖檔 (選填)</label>
              <input type="file" id="admin-case-obituary" accept="image/*" class="w-full text-xs text-slate-300 file:mr-2 file:py-1 file:px-3 file:rounded file:border-0 file:text-xs file:bg-slate-700 file:text-slate-200 cursor-pointer">
            </div>
            <button type="submit" class="w-full py-2.5 bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold rounded-lg text-sm transition flex items-center justify-center gap-2">
              <i class="fa-solid fa-plus"></i> 新增案件至前台選單
            </button>
          </form>
        </div>

        <!-- Active Cases List -->
        <div class="bg-slate-800/80 rounded-xl border border-slate-700 p-5 shadow-md">
          <h2 class="font-serif text-lg font-bold text-slate-200 border-b border-slate-700 pb-3 mb-4 flex items-center justify-between">
            <span><i class="fa-solid fa-list-check text-amber-500"></i> 目前承接案件</span>
            <span id="case-count-badge" class="text-xs bg-slate-700 text-slate-300 px-2 py-0.5 rounded-full">0 筆</span>
          </h2>
          <div id="admin-cases-list" class="space-y-2 max-h-80 overflow-y-auto pr-1">
          </div>
        </div>
      </div>

      <!-- Right: Orders Management -->
      <div class="lg:col-span-2 bg-slate-800/80 rounded-xl border border-slate-700 p-5 shadow-md">
        <div class="flex flex-wrap items-center justify-between border-b border-slate-700 pb-3 mb-4 gap-2">
          <h2 class="font-serif text-lg font-bold text-slate-200 flex items-center gap-2">
            <i class="fa-solid fa-boxes-packing text-amber-500"></i> 訂單列表管理
          </h2>
          <div class="flex items-center gap-2">
            <button onclick="renderAdminOrders()" class="text-xs bg-slate-700 hover:bg-slate-600 px-2.5 py-1.5 rounded text-slate-200 flex items-center gap-1">
              <i class="fa-solid fa-rotate"></i> 重新整理
            </button>
          </div>
        </div>

        <div id="admin-orders-list" class="space-y-4 max-h-[700px] overflow-y-auto pr-1">
        </div>
      </div>
    </div>

  </main>

  <!-- Modal: Admin Auth Lock -->
  <div id="auth-modal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-amber-600/40 rounded-2xl p-6 max-w-sm w-full space-y-5 shadow-2xl text-center">
      <div class="w-12 h-12 rounded-full bg-amber-950 border border-amber-500/50 text-amber-400 flex items-center justify-center mx-auto text-xl">
        <i class="fa-solid fa-lock"></i>
      </div>
      <div>
        <h3 class="font-serif font-bold text-slate-100 text-lg">商家後台密碼驗證</h3>
        <p class="text-xs text-slate-400 mt-1">此區僅限龍園工作人員存取，請輸入管理密碼</p>
      </div>
      <div>
        <input type="password" id="admin-pass-input" placeholder="請輸入商家密碼 (預設: 8888)"
          class="w-full text-center py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-slate-100 placeholder-slate-500 focus:outline-none focus:border-amber-500">
      </div>
      <div class="flex gap-3">
        <button onclick="verifyAdminPassword()" class="w-full py-2.5 bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold rounded-lg text-xs transition">登入商家後台</button>
      </div>
    </div>
  </div>

  <!-- Modal: Image Viewer -->
  <div id="image-modal" class="fixed inset-0 z-50 hidden bg-black/90 backdrop-blur-md flex items-center justify-center p-4">
    <button onclick="closeImageModal()" class="absolute top-4 right-4 text-white text-3xl hover:text-amber-400 transition">
      <i class="fa-solid fa-xmark"></i>
    </button>
    <div class="max-w-4xl max-h-[90vh] flex flex-col items-center">
      <img id="modal-img" src="" class="max-w-full max-h-[80vh] object-contain rounded-lg border border-slate-700 shadow-2xl">
      <p id="modal-caption" class="text-slate-300 text-sm mt-3 text-center font-serif"></p>
    </div>
  </div>

  <!-- Modal: Upload Photos -->
  <div id="upload-modal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 max-w-md w-full space-y-5 shadow-2xl">
      <div class="flex items-center justify-between border-b border-slate-700 pb-3">
        <h3 class="font-serif font-bold text-amber-400 text-lg">上傳現場佈置完成照片</h3>
        <button onclick="closeUploadModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <input type="hidden" id="upload-target-order-id">
      
      <div class="space-y-3">
        <label class="block text-xs text-slate-300">選擇佈置照片 (可選一張或多張上傳)</label>
        <input type="file" id="admin-setup-photo-input" accept="image/*" class="w-full text-xs text-slate-300 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-amber-600 file:text-slate-950 hover:file:bg-amber-500 cursor-pointer">
      </div>

      <div class="flex justify-end gap-3 pt-2">
        <button onclick="closeUploadModal()" class="px-4 py-2 bg-slate-700 text-slate-200 rounded-lg text-xs font-medium">取消</button>
        <button onclick="submitSetupPhoto()" class="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-slate-950 rounded-lg text-xs font-bold">確認上傳</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 hidden bg-slate-800 text-slate-100 border border-amber-500/50 px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 transition-all duration-300">
    <i id="toast-icon" class="fa-solid fa-circle-check text-amber-400 text-lg"></i>
    <span id="toast-message" class="text-sm font-medium">提示訊息</span>
  </div>

  <script src="script.js"></script>
</body>
</html>
